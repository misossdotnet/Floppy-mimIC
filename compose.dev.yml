services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mimic_dev
      POSTGRES_USER: mimic_dev
      POSTGRES_PASSWORD: ${MIMIC_DEV_PG_PASSWORD:?Définir MIMIC_DEV_PG_PASSWORD}
    volumes:
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/001-test-db.sql:ro
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mimic_dev -d mimic_dev"]
      interval: 2s
      retries: 20

  redis:
    image: redis:8.2-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

  minio-data-init:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["chown -R 100:101 /data"]
    volumes:
      - minio_data:/data

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    depends_on:
      minio-data-init:
        condition: service_completed_successfully
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MIMIC_S3_ACCESS_KEY:?Définir MIMIC_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MIMIC_S3_SECRET_KEY:?Définir MIMIC_S3_SECRET_KEY}
    ports:
      - "127.0.0.1:55000:9000"
      - "127.0.0.1:55001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      retries: 20

volumes:
  minio_data:
